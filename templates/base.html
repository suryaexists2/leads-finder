<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn Lead Gen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.nav{background:linear-gradient(135deg,#0a66c2,#004182);padding:0 24px;display:flex;align-items:center;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav a{color:rgba(255,255,255,.85);text-decoration:none;font-weight:500;font-size:14px;padding:8px 14px;border-radius:6px;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.15);color:#fff}
.nav a.active{background:rgba(255,255,255,.2);color:#fff}
.nav .brand{font-size:17px;font-weight:700;color:#fff;margin-right:auto;letter-spacing:-.3px}
.nav .brand span{opacity:.7;font-weight:400;font-size:13px;margin-left:6px}
.wrap{max-width:1080px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin-bottom:14px;color:#0a66c2;display:flex;align-items:center;gap:8px}
.card h2 .icon{font-size:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#f0f6ff;border-radius:10px;padding:18px 14px;text-align:center}
.stat .n{font-size:32px;font-weight:700;color:#0a66c2;line-height:1}
.stat .l{font-size:12px;color:#666;margin-top:6px}
.form-g{margin-bottom:14px}
.form-g label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#555}
.form-g input,.form-g select,.form-g textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;transition:.2s;font-family:inherit}
.form-g input:focus,.form-g select:focus,.form-g textarea:focus{border-color:#0a66c2;outline:none;box-shadow:0 0 0 3px rgba(10,102,194,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none}
.btn-p{background:#0a66c2;color:#fff}.btn-p:hover{background:#004182}
.btn-s{background:#059669;color:#fff}.btn-s:hover{background:#047857}
.btn-d{background:#dc2626;color:#fff}.btn-d:hover{background:#b91c1c}
.btn-g{background:#e5e7eb;color:#444}.btn-g:hover{background:#d1d5db}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fa;text-align:left;padding:10px 8px;border-bottom:2px solid #e5e7eb;font-weight:600;color:#555}
td{padding:10px 8px;border-bottom:1px solid #f0f0f0}
tr:hover{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.b-new{background:#dbeafe;color:#1e40af}
.b-sent{background:#d1fae5;color:#065f46}
.b-err{background:#fee2e2;color:#991b1b}
.b-warn{background:#fef3c7;color:#92400e}
.flash{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
.flash-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.flash-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.flash-warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.empty{text-align:center;padding:48px 20px;color:#999}
.empty a{color:#0a66c2}
.logs{background:#1a1a2e;color:#a5f3a5;padding:14px;border-radius:8px;font-family:'Cascadia Code',Consolas,monospace;font-size:12px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.pill{display:inline-block;padding:4px 12px;border-radius:16px;font-size:12px;cursor:pointer;border:1.5px solid #ddd;transition:.15s;background:#fff}
.pill:hover,.pill.on{background:#0a66c2;color:#fff;border-color:#0a66c2}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div class="nav">
  <a class="brand" href="/">LeadGen<span>LinkedIn</span></a>
  <a href="/scrape" {% if request.path=='/scrape' %}class="active"{% endif %}>Scrape</a>
  <a href="/leads" {% if request.path=='/leads' %}class="active"{% endif %}>Leads</a>
  <a href="/send" {% if request.path=='/send' %}class="active"{% endif %}>Email</a>
  <a href="/settings" {% if request.path=='/settings' %}class="active"{% endif %}>Settings</a>
</div>
<div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash flash-{{cat}}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
